<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cal Poly Makerspaces</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    /* ── Cal Poly Brand Palette ── */
    :root {
      --poly-green:      #154734;
      --mustang-gold:    #BD8B13;
      --farmers-market:  #3A913F;
      --dexter-green:    #A4D65E;
      --poly-canyon:     #F2C75C;
      --stadium-gold:    #F8E08E;
      --surf-blue:       #5CB8B2;
      --mission-beige:   #E4E3D3;
      --sycamore:        #789F90;
      --seal-gray:       #54585A;
      --kennedy-gray:    #8E9089;
      --heritage-orange: #FF6A39;

      --open-green:  #2d7a3a;
      --open-bg:     #eaf6ec;
      --closed-gray: #8E9089;
      --closed-bg:   #f0f0ee;

      --bg:        #f5f4ef;
      --card-bg:   #ffffff;
      --text:      #1a1a18;
      --border:    #dddbd1;
      --shadow-md: 0 8px 32px rgba(21,71,52,.16);
      --radius:    12px;
      --header-h:  64px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Source Sans 3', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      background: var(--poly-green);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1100;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
    }

    .header-brand { display: flex; align-items: center; gap: 12px; }

    .header-shield {
      width: 36px; height: 36px;
      background: var(--mustang-gold);
      clip-path: polygon(50% 0%,100% 15%,100% 60%,50% 100%,0% 60%,0% 15%);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }

    .header-title { display: flex; flex-direction: column; line-height: 1.1; }
    .header-title span:first-child {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem; font-weight: 900; color: #fff;
    }
    .header-title span:last-child {
      font-size: .68rem; font-weight: 300;
      color: var(--stadium-gold); letter-spacing: .12em; text-transform: uppercase;
    }

    .header-count {
      background: var(--mustang-gold);
      color: #fff; font-size: .72rem; font-weight: 600;
      padding: 4px 10px; border-radius: 20px;
      letter-spacing: .06em; white-space: nowrap;
    }

    /* ── Layout ── */
    .app { display: flex; height: 100vh; padding-top: var(--header-h); }

    /* ── Sidebar ── */
    .sidebar {
      width: 340px; flex-shrink: 0;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden; z-index: 900;
      transition: transform .3s cubic-bezier(.4,0,.2,1);
    }

    .sidebar-inner {
      flex: 1; overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Sidebar header + filters ── */
    .sidebar-header {
      padding: 14px 16px 0;
      border-bottom: 1px solid var(--border);
      background: var(--mission-beige);
      flex-shrink: 0;
    }

    .sidebar-header-top {
      display: flex; align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .sidebar-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1rem; font-weight: 700; color: var(--poly-green);
    }

    .sidebar-result-count {
      font-size: .72rem; color: var(--kennedy-gray);
    }

    /* ── Filter pills ── */
    .filter-section { margin-bottom: 10px; }

    .filter-row {
      display: flex; flex-wrap: wrap; gap: 5px;
      padding-bottom: 10px;
    }

    .filter-pill {
      font-size: .68rem; font-weight: 600;
      padding: 4px 10px; border-radius: 20px;
      border: 1.5px solid var(--border);
      background: #fff; color: var(--seal-gray);
      cursor: pointer; letter-spacing: .04em;
      text-transform: uppercase;
      transition: all .15s;
      white-space: nowrap;
      user-select: none;
    }

    .filter-pill:hover {
      border-color: var(--poly-green);
      color: var(--poly-green);
    }

    .filter-pill.active {
      background: var(--poly-green);
      border-color: var(--poly-green);
      color: #fff;
    }

    .filter-pill.open-now-pill.active {
      background: var(--open-green);
      border-color: var(--open-green);
      color: #fff;
    }

    .filter-pill.open-now-pill {
      border-color: var(--open-green);
      color: var(--open-green);
    }

    .filter-divider {
      width: 1px; background: var(--border);
      margin: 0 2px; align-self: stretch;
      flex-shrink: 0;
    }

    /* ── No-results message ── */
    .no-results {
      padding: 32px 20px;
      text-align: center;
      color: var(--kennedy-gray);
      font-size: .85rem;
      display: none;
    }

    .no-results span { font-size: 2rem; display: block; margin-bottom: 8px; }

    /* ── Space cards ── */
    .space-card {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .15s;
    }

    .space-card:hover { background: var(--mission-beige); }

    .space-card.active {
      background: #edf5f0;
      border-left: 3px solid var(--poly-green);
      padding-left: 13px;
    }

    .space-card.hidden { display: none; }

    .space-card-thumb {
      width: 52px; height: 52px;
      border-radius: 8px; object-fit: cover;
      flex-shrink: 0; background: var(--mission-beige);
      position: relative;
    }

    .space-card-body { flex: 1; min-width: 0; }

    .space-card-name-row {
      display: flex; align-items: center;
      gap: 6px; margin-bottom: 1px;
    }

    .space-card-name {
      font-weight: 600; font-size: .88rem;
      color: var(--poly-green);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1; min-width: 0;
    }

    /* ── Open/Closed badges ── */
    .status-badge {
      font-size: .6rem; font-weight: 700;
      padding: 2px 7px; border-radius: 20px;
      letter-spacing: .07em; text-transform: uppercase;
      white-space: nowrap; flex-shrink: 0;
    }

    .status-badge.open {
      background: var(--open-bg);
      color: var(--open-green);
      border: 1px solid #b6debb;
    }

    .status-badge.closed {
      background: var(--closed-bg);
      color: var(--closed-gray);
      border: 1px solid #d8d8d4;
    }

    /* Dot in popup */
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px; border-radius: 50%;
      margin-right: 5px; flex-shrink: 0;
      vertical-align: middle;
    }
    .status-dot.open  { background: var(--open-green); box-shadow: 0 0 0 2px #c2e8c6; }
    .status-dot.closed { background: var(--closed-gray); }

    .space-card-building {
      font-size: .73rem; color: var(--kennedy-gray); margin-top: 1px;
    }

    .space-card-tags {
      display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px;
    }

    .tag {
      font-size: .63rem; font-weight: 600;
      padding: 2px 6px; border-radius: 20px;
      background: var(--mission-beige); color: var(--poly-green);
      letter-spacing: .04em; text-transform: uppercase;
    }

    /* ── Map ── */
    #map { flex: 1; height: 100%; }

    /* ── Popup ── */
    .leaflet-popup-content-wrapper {
      border-radius: var(--radius) !important;
      padding: 0 !important; overflow: hidden;
      box-shadow: var(--shadow-md) !important;
      border: none !important;
      max-width: 300px; width: 300px;
    }

    .leaflet-popup-content { margin: 0 !important; width: 100% !important; }
    .leaflet-popup-tip-container { margin-top: -1px; }

    .popup-img {
      width: 100%; height: 140px;
      object-fit: cover; display: block;
      background: var(--mission-beige);
    }

    .popup-body { padding: 13px 15px 15px; }

    .popup-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.02rem; font-weight: 700;
      color: var(--poly-green); line-height: 1.2;
    }

    .popup-building {
      font-size: .73rem; color: var(--kennedy-gray);
      margin-top: 2px;
    }

    .popup-status-row {
      display: flex; align-items: center;
      margin-top: 8px; font-size: .75rem;
    }

    .popup-hours-text { color: var(--seal-gray); }

    .popup-desc {
      font-size: .78rem; line-height: 1.5;
      margin-top: 8px; color: var(--text);
    }

    .popup-hours-box {
      margin-top: 9px;
      background: var(--mission-beige);
      border-radius: 8px; padding: 8px 10px;
      font-size: .73rem; color: var(--seal-gray);
    }

    .popup-tags {
      display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px;
    }

    .popup-tag {
      font-size: .63rem; font-weight: 600;
      padding: 3px 8px; border-radius: 20px;
      background: var(--poly-green); color: #fff;
      letter-spacing: .05em; text-transform: uppercase;
    }

    /* ── Custom markers ── */
    .custom-marker { display: flex; align-items: center; justify-content: center; }

    .marker-pin {
      width: 32px; height: 32px;
      border-radius: 50% 50% 50% 0;
      border: 2.5px solid #fff;
      transform: rotate(-45deg);
      box-shadow: 0 3px 10px rgba(0,0,0,.28);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform .15s, background .15s;
    }

    .marker-pin.open-marker   { background: var(--poly-green); }
    .marker-pin.closed-marker { background: var(--kennedy-gray); }
    .marker-pin.active        { transform: rotate(-45deg) scale(1.2); }
    .marker-pin.active.open-marker   { background: var(--mustang-gold); }
    .marker-pin.active.closed-marker { background: var(--seal-gray); }

    .marker-pin:hover { transform: rotate(-45deg) scale(1.12); }

    .marker-pin-inner {
      transform: rotate(45deg);
      color: #fff; font-size: 12px; line-height: 1;
    }

    /* ── Mobile toggle ── */
    .list-toggle {
      display: none;
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      background: var(--poly-green); color: #fff;
      border: none; border-radius: 30px;
      padding: 12px 22px;
      font-family: 'Source Sans 3', sans-serif;
      font-size: .88rem; font-weight: 600;
      cursor: pointer; z-index: 1200;
      box-shadow: var(--shadow-md);
      align-items: center; gap: 7px;
      letter-spacing: .04em;
      transition: background .15s;
    }
    .list-toggle:hover { background: var(--farmers-market); }

    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.4); z-index: 899;
    }

    /* ── Loading ── */
    .loading-overlay {
      position: fixed; inset: 0;
      background: var(--poly-green);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999; gap: 20px;
      transition: opacity .5s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }

    .loading-shield {
      width: 56px; height: 56px;
      background: var(--mustang-gold);
      clip-path: polygon(50% 0%,100% 15%,100% 60%,50% 100%,0% 60%,0% 15%);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.08); opacity: .8; }
    }

    .loading-text {
      font-family: 'Playfair Display', serif;
      color: #fff; font-size: 1.05rem; letter-spacing: .05em;
    }

    /* ── Error banner ── */
    .error-banner {
      background: var(--heritage-orange); color: #fff;
      padding: 10px 20px; font-size: .82rem;
      text-align: center; display: none;
    }

    /* ── Leaflet overrides ── */
    .leaflet-control-zoom a { color: var(--poly-green) !important; font-weight: 700; }
    .leaflet-control-zoom a:hover { background: var(--mission-beige) !important; }
    .leaflet-control-attribution { font-size: .64rem !important; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: var(--header-h); left: 0; bottom: 0;
        width: 100%; max-width: 400px;
        transform: translateX(-110%); z-index: 1000;
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.visible { display: block; }
      .list-toggle { display: flex; }
      .leaflet-popup-content-wrapper { max-width: 260px; width: 260px; }
    }
  </style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="loading-shield"></div>
  <div class="loading-text">Cal Poly Makerspaces</div>
</div>

<header>
  <div class="header-brand">
    <div class="header-shield">⚙</div>
    <div class="header-title">
      <span>Cal Poly Makerspaces</span>
      <span>San Luis Obispo</span>
    </div>
  </div>
  <div class="header-count" id="headerCount">Loading…</div>
</header>

<div class="error-banner" id="errorBanner">
  ⚠️ Could not load <code>makerspaces.geojson</code>. Make sure the file is in the same directory as index.html.
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-header-top">
        <h2>Find a Makerspace</h2>
        <span class="sidebar-result-count" id="resultCount"></span>
      </div>
      <div class="filter-section">
        <div class="filter-row" id="filterRow">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
    <div class="sidebar-inner">
      <div id="sidebarList"></div>
      <div class="no-results" id="noResults">
        <span>🔍</span>
        No spaces match your filters.<br>Try removing a filter above.
      </div>
    </div>
  </aside>

  <div id="map"></div>
</div>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<button class="list-toggle" id="listToggle" onclick="toggleSidebar()">
  📍 View List
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
// ── Map init ──────────────────────────────────────────────────────────────
const map = L.map('map', { center: [35.2994, -120.6625], zoom: 16 });

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd', maxZoom: 20,
}).addTo(map);

// ── State ─────────────────────────────────────────────────────────────────
let activeMarker   = null;
let markersById    = {};   // id → { marker, latlng, props, isOpen }
let activeFilters  = new Set();  // active tag filters
let openNowFilter  = false;
let totalCount     = 0;

// ── Hours logic ───────────────────────────────────────────────────────────
const DAY_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];

function isOpenNow(hours_structured) {
  if (!hours_structured) return null; // unknown
  const now  = new Date();
  const dayKey = DAY_KEYS[now.getDay()];
  const slot = hours_structured[dayKey];
  if (!slot) return false; // closed today

  const [openH, openM]  = slot[0].split(':').map(Number);
  const [closeH, closeM] = slot[1].split(':').map(Number);
  const nowMins  = now.getHours() * 60 + now.getMinutes();
  const openMins = openH * 60 + openM;
  const closeMins= closeH * 60 + closeM;
  return nowMins >= openMins && nowMins < closeMins;
}

// ── Marker icon factory ───────────────────────────────────────────────────
function createMarkerIcon(id, isOpen, active = false) {
  const openClass   = isOpen ? 'open-marker' : 'closed-marker';
  const activeClass = active ? 'active' : '';
  return L.divIcon({
    className: 'custom-marker',
    html: `<div class="marker-pin ${openClass} ${activeClass}" id="pin-${id}">
             <span class="marker-pin-inner">⚙</span>
           </div>`,
    iconSize: [32, 32],
    iconAnchor: [16, 32],
    popupAnchor: [0, -34],
  });
}

// ── Status badge HTML ─────────────────────────────────────────────────────
function statusBadgeHTML(isOpen) {
  if (isOpen === null) return '';
  return isOpen
    ? `<span class="status-badge open">Open Now</span>`
    : `<span class="status-badge closed">Closed</span>`;
}

function statusDotHTML(isOpen) {
  if (isOpen === null) return '';
  const cls  = isOpen ? 'open' : 'closed';
  const text = isOpen ? 'Open now' : 'Closed';
  return `<span class="status-dot ${cls}"></span><span class="popup-hours-text">${text}</span>`;
}

// ── Popup HTML ────────────────────────────────────────────────────────────
function buildPopupHTML(props, isOpen) {
  const tags = (props.tags || []).map(t => `<span class="popup-tag">${t}</span>`).join('');
  return `
    <img class="popup-img" src="${props.image||''}" alt="${props.name}" onerror="this.style.display='none'" />
    <div class="popup-body">
      <div class="popup-name">${props.name}</div>
      <div class="popup-building">📍 ${props.building||''}</div>
      ${isOpen !== null ? `<div class="popup-status-row">${statusDotHTML(isOpen)}</div>` : ''}
      <div class="popup-desc">${props.description||''}</div>
      ${props.hours_display ? `<div class="popup-hours-box">🕐 ${props.hours_display}</div>` : ''}
      ${tags ? `<div class="popup-tags">${tags}</div>` : ''}
    </div>`;
}

// ── Sidebar card HTML ─────────────────────────────────────────────────────
function buildCardHTML(props, id, isOpen) {
  const tags = (props.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
  return `
    <div class="space-card" id="card-${id}" onclick="focusSpace(${id})">
      <img class="space-card-thumb" src="${props.image||''}" alt="${props.name}"
           onerror="this.style.background='#E4E3D3'" />
      <div class="space-card-body">
        <div class="space-card-name-row">
          <div class="space-card-name">${props.name}</div>
          ${statusBadgeHTML(isOpen)}
        </div>
        <div class="space-card-building">${props.building||''}</div>
        <div class="space-card-tags">${tags}</div>
      </div>
    </div>`;
}

// ── Filtering ─────────────────────────────────────────────────────────────
function applyFilters() {
  let visible = 0;

  Object.entries(markersById).forEach(([id, entry]) => {
    const { props, isOpen, marker } = entry;
    const tags = props.tags || [];

    const passesTag = activeFilters.size === 0
      || [...activeFilters].every(f => tags.includes(f));

    const passesOpen = !openNowFilter || isOpen === true;

    const show = passesTag && passesOpen;

    const card = document.getElementById(`card-${id}`);
    if (card) card.classList.toggle('hidden', !show);

    if (show) {
      if (!map.hasLayer(marker)) marker.addTo(map);
      visible++;
    } else {
      if (map.hasLayer(marker)) map.removeLayer(marker);
      if (activeMarker == id) {
        marker.closePopup();
        activeMarker = null;
      }
    }
  });

  document.getElementById('noResults').style.display = visible === 0 ? 'block' : 'none';
  document.getElementById('resultCount').textContent =
    visible === totalCount ? '' : `${visible} of ${totalCount}`;
  document.getElementById('headerCount').textContent =
    `${visible} Space${visible !== 1 ? 's' : ''}`;
}

// ── Filter pill click ─────────────────────────────────────────────────────
function toggleTagFilter(tag, el) {
  if (activeFilters.has(tag)) {
    activeFilters.delete(tag);
    el.classList.remove('active');
  } else {
    activeFilters.add(tag);
    el.classList.add('active');
  }
  applyFilters();
}

function toggleOpenNow(el) {
  openNowFilter = !openNowFilter;
  el.classList.toggle('active', openNowFilter);
  applyFilters();
}

// ── Focus a space ─────────────────────────────────────────────────────────
function focusSpace(id) {
  const entry = markersById[id];
  if (!entry) return;

  map.setView(entry.latlng, 18, { animate: true });
  setTimeout(() => entry.marker.openPopup(), 300);

  // Deactivate previous
  if (activeMarker !== null) {
    const prev = markersById[activeMarker];
    if (prev) prev.marker.setIcon(createMarkerIcon(activeMarker, prev.isOpen, false));
    const prevCard = document.getElementById(`card-${activeMarker}`);
    if (prevCard) prevCard.classList.remove('active');
  }

  entry.marker.setIcon(createMarkerIcon(id, entry.isOpen, true));
  activeMarker = id;

  const card = document.getElementById(`card-${id}`);
  if (card) {
    card.classList.add('active');
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  if (window.innerWidth <= 768) setTimeout(closeSidebar, 400);
}

// ── Mobile sidebar ────────────────────────────────────────────────────────
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
}

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('visible');
  document.getElementById('listToggle').textContent = '✕ Close';
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('visible');
  document.getElementById('listToggle').innerHTML = '📍 View List';
}

document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

// ── Load GeoJSON ──────────────────────────────────────────────────────────
async function loadMakerspaces() {
  try {
    const res = await fetch('./makerspaces.geojson');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const features = data.features || [];
    totalCount = features.length;

    const listEl   = document.getElementById('sidebarList');
    const filterEl = document.getElementById('filterRow');
    const allTags  = new Set();

    // Collect all tags first
    features.forEach(f => (f.properties.tags || []).forEach(t => allTags.add(t)));

    // Build filter row: Open Now pill + divider + tag pills
    const openNowPill = document.createElement('button');
    openNowPill.className = 'filter-pill open-now-pill';
    openNowPill.textContent = '🟢 Open Now';
    openNowPill.onclick = () => toggleOpenNow(openNowPill);
    filterEl.appendChild(openNowPill);

    if (allTags.size > 0) {
      const divider = document.createElement('div');
      divider.className = 'filter-divider';
      filterEl.appendChild(divider);
    }

    [...allTags].sort().forEach(tag => {
      const pill = document.createElement('button');
      pill.className = 'filter-pill';
      pill.textContent = tag;
      pill.onclick = () => toggleTagFilter(tag, pill);
      filterEl.appendChild(pill);
    });

    // Build markers and cards
    features.forEach((feature, idx) => {
      const id     = idx;
      const props  = feature.properties || {};
      const coords = feature.geometry.coordinates;
      const latlng = [coords[1], coords[0]];
      const isOpen = isOpenNow(props.hours_structured);

      const marker = L.marker(latlng, { icon: createMarkerIcon(id, isOpen) })
        .addTo(map)
        .bindPopup(buildPopupHTML(props, isOpen), { maxWidth: 300 });

      marker.on('click', () => focusSpace(id));
      marker.on('popupclose', () => {
        if (activeMarker === id) {
          marker.setIcon(createMarkerIcon(id, isOpen, false));
          const card = document.getElementById(`card-${id}`);
          if (card) card.classList.remove('active');
          activeMarker = null;
        }
      });

      markersById[id] = { marker, latlng, props, isOpen };
      listEl.insertAdjacentHTML('beforeend', buildCardHTML(props, id, isOpen));
    });

    document.getElementById('headerCount').textContent =
      `${totalCount} Space${totalCount !== 1 ? 's' : ''}`;

    // Fit map bounds
    if (features.length > 0) {
      const group = L.featureGroup(Object.values(markersById).map(e => e.marker));
      map.fitBounds(group.getBounds().pad(0.22));
    }

  } catch (err) {
    console.error('Failed to load GeoJSON:', err);
    document.getElementById('errorBanner').style.display = 'block';
    document.getElementById('headerCount').textContent = 'Error';
  } finally {
    setTimeout(() => {
      const overlay = document.getElementById('loading');
      overlay.classList.add('hidden');
      setTimeout(() => overlay.remove(), 600);
    }, 600);
  }
}

loadMakerspaces();
</script>
</body>
</html>
